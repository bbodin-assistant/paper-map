name: v0.4.5 Selenium diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/selenium-v045-diagnostic.yml

permissions:
  contents: read
  actions: read

jobs:
  selenium-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact v0.4.5 release head
        uses: actions/checkout@v4
        with:
          ref: ffb38032d573eff55b555772e99310a04f7677d4

      - name: Download v0.4.5 WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: paper-map-wasm
          path: www/pkg
          run-id: 34699886645
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements-ui.txt

      - name: Install browser-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements-ui.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          (google-chrome --version || google-chrome-stable --version || chromium --version || chromium-browser --version)

      - name: Start app server
        run: |
          mkdir -p artifacts/selenium-v045
          python3 -m http.server 8080 --directory . > artifacts/selenium-v045/server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/www/ >/dev/null && exit 0
            sleep 1
          done
          cat artifacts/selenium-v045/server.log
          exit 1

      - name: Run every Selenium script independently
        env:
          TEST_URL: http://127.0.0.1:8080/www/
          MOBILE_TEST_ARTIFACT_DIR: artifacts/selenium-v045
        run: |
          set +e
          failures=0
          : > artifacts/selenium-v045/results.txt
          tests=(
            tests/mobile_selenium_test.py
            tests/ai_model_discovery_selenium_test.py
            tests/pdf_review_selenium_test.py
            tests/pdf_batch_import_selenium_test.py
            tests/pdf_local_citation_selenium_test.py
            tests/reference_candidate_selenium_test.py
            tests/source_filter_log_selenium_test.py
            tests/graph_relations_selenium_test.py
            tests/timeline_selenium_test.py
          )
          for test_file in "${tests[@]}"; do
            echo "===== RUN $test_file ====="
            python3 "$test_file" 2>&1 | tee "artifacts/selenium-v045/$(basename "$test_file").log"
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then
              echo "PASS $test_file" | tee -a artifacts/selenium-v045/results.txt
            else
              echo "FAIL $test_file exit=$status" | tee -a artifacts/selenium-v045/results.txt
              failures=$((failures + 1))
            fi
          done
          echo "===== SUMMARY ====="
          cat artifacts/selenium-v045/results.txt
          echo "FAILURE_COUNT=$failures"
          exit "$failures"

      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-v045-diagnostic
          path: artifacts/selenium-v045
          if-no-files-found: error
