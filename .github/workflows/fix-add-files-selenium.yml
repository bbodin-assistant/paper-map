name: Fix Add files Selenium expectation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-add-files-selenium.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update mobile Selenium label expectation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/mobile_selenium_test.py')
          text = path.read_text()
          old = 'assert_true(add_files.text == "Add", "Publication file import should be a direct Add toolbar action")'
          new = 'assert_true(add_files.text == "Add files", "Publication file import should be labeled Add files")'
          if old not in text:
              raise SystemExit('Expected old Add assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/mobile_selenium_test.py
          git commit -m "Update Add files Selenium expectation"
          git push
