name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript, Rust, and unit checks
        run: make test

  rust-wasm:
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Compile Rust citation extractor for WebAssembly
        run: |
          cargo check --target wasm32-unknown-unknown
          make build-wasm
      - name: Upload generated WASM package
        uses: actions/upload-artifact@v4
        with:
          name: paper-map-wasm
          path: www/pkg
          if-no-files-found: error

  mobile-ui:
    needs: rust-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: paper-map-wasm
          path: www/pkg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements-ui.txt
      - name: Install Selenium and OCR dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements-ui.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Show browser and OCR versions
        run: |
          (google-chrome --version || google-chrome-stable --version || chromium --version || chromium-browser --version)
          tesseract --version | head -n 1
      - name: Start static app server
        run: |
          mkdir -p artifacts/mobile-ui
          python3 -m http.server 8080 --directory . > artifacts/mobile-ui/server.log 2>&1 &
          echo $! > /tmp/paper-map-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/www/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/mobile-ui/server.log
          exit 1
      - name: Mobile Selenium interaction, AI model discovery, PDF review, batch import, reference resolution, source filtering/logging, graph gesture, and Timeline tests
        env:
          TEST_URL: http://127.0.0.1:8080/www/
          MOBILE_TEST_ARTIFACT_DIR: artifacts/mobile-ui
        run: |
          python3 tests/mobile_selenium_test.py
          python3 tests/ai_model_discovery_selenium_test.py
          python3 tests/pdf_review_selenium_test.py
          python3 tests/pdf_batch_import_selenium_test.py
          python3 tests/pdf_local_citation_selenium_test.py
          python3 tests/reference_candidate_selenium_test.py
          python3 tests/source_filter_log_selenium_test.py
          python3 tests/graph_relations_selenium_test.py
          python3 tests/timeline_selenium_test.py
      - name: Upload mobile UI screenshots and OCR output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-artifacts
          path: artifacts/mobile-ui
          if-no-files-found: warn
