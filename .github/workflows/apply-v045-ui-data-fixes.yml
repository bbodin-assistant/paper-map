name: Apply v0.4.5 UI and data fixes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v045-ui-data-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tighten v0.4.5 source and Selenium coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'www/pdf-ai-import.js',
              'Results are merged without overwriting fields you have edited manually. PDF bytes remain transient browser input and are not stored in IndexedDB.',
              'Results are merged without overwriting fields you have edited manually. When a reviewed PDF is saved, its original file is stored locally in this browser so it can be reopened from the paper details.',
          )
          replace_once(
              'www/paper-online-update.js',
              'import { providerPapersToReferences } from "./provider-references.js";\n',
              'import { providerPapersToReferences } from "./provider-references.js?v=0.4.5";\n',
          )

          replace_once(
              'tests/pdf_review_selenium_test.py',
              '        assert_true(add_button.text == "Add", "The unified Add toolbar button should remain available to the PDF review flow")\n',
              '        assert_true(add_button.text == "Add files", "The unified file-import toolbar button should be labeled Add files")\n',
          )
          replace_once(
              'tests/pdf_review_selenium_test.py',
              '''        assert_widget_text_visible(driver, "#pdf-ai-dialog", "Reviewed PDF import widget")\n        assert_true(not driver.find_elements(By.CSS_SELECTOR, ".pdf-ai-provider-settings"), "AI settings must not be embedded in reviewed import")\n''',
              '''        assert_widget_text_visible(driver, "#pdf-ai-dialog", "Reviewed PDF import widget")\n        assert_true(not driver.find_elements(By.CSS_SELECTOR, ".pdf-ai-provider-settings"), "AI settings must not be embedded in reviewed import")\n        open_pdf = wait.until(EC.element_to_be_clickable((By.ID, "pdf-ai-open-file")))\n        driver.execute_script("window.__paperMapOpenedPdf = ''; window.open = (url) => { window.__paperMapOpenedPdf = String(url); return null; };")\n        open_pdf.click()\n        wait.until(lambda d: (d.execute_script("return window.__paperMapOpenedPdf || ''") or '').startswith('blob:'))\n''',
          )
          replace_once(
              'tests/pdf_review_selenium_test.py',
              '''        assert_true(\n            driver.find_element(By.CSS_SELECTOR, "#pdf-review-tabs [data-pdf-tab-id]").get_attribute("data-local-status") == "complete",\n            "Selected PDF should run local extraction automatically",\n        )\n\n        wait_click(driver, "#pdf-ai-analyze")\n''',
              '''        assert_true(\n            driver.find_element(By.CSS_SELECTOR, "#pdf-review-tabs [data-pdf-tab-id]").get_attribute("data-local-status") == "complete",\n            "Selected PDF should run local extraction automatically",\n        )\n        assert_true(\n            driver.find_element(By.CSS_SELECTOR, "#pdf-review-tabs [data-pdf-tab-id]").get_attribute("data-review-status") == "success",\n            "A successfully processed PDF tab should be marked success for green styling",\n        )\n\n        wait_click(driver, "#pdf-ai-analyze")\n''',
          )
          PY
      - name: Commit regression updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www tests
          git commit -m "Test PDF import preview and outcome states"
          git push
