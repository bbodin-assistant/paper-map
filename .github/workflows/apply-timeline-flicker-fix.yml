name: Apply Timeline Flicker Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-timeline-flicker-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Timeline selection rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('www/app.js')
          text = path.read_text()
          old = '''function selectPaper(paperId) {
            state.selectedPaperId = paperId;
            if (!paperId) {
              closeDetail();
              renderAll();
              return;
            }
            renderAll();
          }
          '''
          new = '''function timelineViewActive() {
            return Boolean(
              els.map.querySelector(".timeline-papers")
              && els.mapMode.querySelector('button[data-mode="timeline"].selected'),
            );
          }

          function renderTimelinePaperSelection() {
            for (const button of els.paperList.querySelectorAll(".paper-list-item[data-paper-id]")) {
              button.classList.toggle("selected", button.dataset.paperId === state.selectedPaperId);
            }
            if (state.selectedPaperId) renderDetail();
            else {
              els.detail.hidden = true;
              els.detailDismiss.hidden = true;
            }
          }

          function selectPaper(paperId) {
            state.selectedPaperId = paperId;
            if (timelineViewActive()) {
              renderTimelinePaperSelection();
              return;
            }
            if (!paperId) {
              closeDetail();
              renderAll();
              return;
            }
            renderAll();
          }
          '''
          if old not in text:
            raise SystemExit('Expected selectPaper function was not found; refusing to patch.')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/app.js
          git commit -m "Avoid full graph render for Timeline selection"
          git push
