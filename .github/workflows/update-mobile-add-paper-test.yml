name: Update mobile Selenium Add paper expectation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-mobile-add-paper-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update stale label expectation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/mobile_selenium_test.py')
          text = path.read_text(encoding='utf-8')
          old = 'Add publication'
          count = text.count(old)
          if count == 0:
              raise SystemExit('No stale Add publication expectations found')
          path.write_text(text.replace(old, 'Add paper'), encoding='utf-8')
          print(f'Replaced {count} occurrence(s)')
          PY
      - name: Commit test update
        run: |
          git config user.name "bbodin-assistant"
          git config user.email "bodinbla+gpt@gmail.com"
          git add tests/mobile_selenium_test.py
          git diff --cached --check
          git commit -m "Expect Add paper in mobile Selenium test"
          git push origin HEAD:main
