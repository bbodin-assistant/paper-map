[package]
name = "paper_map_wasm"
version = "0.1.0"
edition = "2021"
description = "Deterministic local PDF citation extraction for Paper Map."
license = "MIT"
repository = "https://github.com/bbodin-assistant/paper-map"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "extract-pdf-citations"
path = "src/main.rs"

[[bin]]
name = "validate-paper-map-json"
path = "src/bin/validate_json.rs"

[dependencies]
pdfplumber = { version = "0.4.1", default-features = false }
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
